<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Solitaire Klondike</title>
    <script
      src="./shinylive/load-shinylive-sw.js"
      type="module"
    ></script>
    <script type="module">
      import { runExportedApp } from "./shinylive/shinylive.js";
      runExportedApp({
        id: "root",
        appEngine: "r",
        relPath: "",
      });
      window.addEventListener("load", () => {
        setTimeout(() => {
          const overlay = document.getElementById("app-loading");
          if (overlay) overlay.remove();
        }, 1200);
      });
    </script>
    <link rel="stylesheet" href="./shinylive/style-resets.css" />
    <link rel="stylesheet" href="./shinylive/shinylive.css" />
    <style>
      html, body { margin: 0; height: 100%; background: #0a4e2b; }
      #app-loading {
        position: fixed; inset: 0; z-index: 2147483647;
        display: flex; align-items: center; justify-content: center;
        background: linear-gradient(180deg, #0d6b38 0%, #0a4e2b 100%);
        color: white; font-family: Segoe UI, Arial, sans-serif;
      }
      .loading-card {
        text-align: center; padding: 24px 28px; border-radius: 20px;
        background: rgba(0,0,0,0.18); border: 1px solid rgba(255,255,255,0.14);
        box-shadow: 0 18px 40px rgba(0,0,0,0.22);
      }
      .loading-spinner {
        width: 44px; height: 44px; margin: 0 auto 14px;
        border-radius: 50%; border: 4px solid rgba(255,255,255,0.25); border-top-color: #fff;
        animation: spin 0.9s linear infinite;
      }
      .loading-sub { opacity: 0.85; font-size: 14px; }
      @keyframes spin { to { transform: rotate(360deg); } }
      #root { height: 100vh; width: 100vw; }
    </style>

  </head>
  <body>
    
    <div id="app-loading"><div class="loading-card"><div class="loading-spinner"></div><div><strong>Chargement du solitaire…</strong></div><div class="loading-sub">Les ressources WebR/Shinylive peuvent prendre quelques secondes au premier démarrage.</div></div></div>
    <div id="root"></div>
    
  </body>
</html>
